# Resonator punchout

preprocess:
  readout_modulation_frequency: 7583.46
  readout_duration: 1000
  readout_gain: 0.2
  drive_duration: 10000
  tof: 200

variables:
  drive_freq_sweep:
    start: 5622
    stop: 5628
    num: 50
    mode: lin
  drive_gain_sweep:
    start: 0.05
    stop: 0.8
    num: 50
    mode: lin

sys_config:
  $shots: 1000
  /axisGeneratorIP_0:
    $dfrequency: "#drive_freq_sweep"
    $rfrequency: "%readout_modulation_frequency"
    $rphase: 0.0
    $rchannel: 1
    $dchannel: 1
    pulse:
      - _name: rect_d
        _readout: false
        _envelope: _RECTANGULAR
        _dac_target: 1
        $duration: "%drive_duration"
        $gain: "#drive_gain_sweep"
      - _name: rect_r
        _readout: true
        _envelope: _RECTANGULAR
        _dac_target: 1
        $duration: "%readout_duration"
        $gain: "%readout_gain"
    $drive_order:
      - rect_d
  /axisAcquisitionIP_0:
    $duration: "%readout_duration"
    $output_type: accumulated
    $rfrequency: "%readout_modulation_frequency"
    $rphase: 0.0
    $rchannel: 1
    $tof: "%tof"
  /axisTriggerGenerator_0:
    $experiment_duration: 50000
    delay:
      - _name: drive_del
        _ttype: drive
        _channel_mask: 1
        _index: 1
        $delay: 100.0
      - _name: read
        _ttype: readout
        _channel_mask: 1
        _index: 2
        $delay: 300

