# Resonator Spectroscopy

preprocess:
  gain: 0.2
  duration: 1000
  tof: 200

variables:
  frequency_sweep:
    start: 7570
    stop: 7600
    num: 1000
    mode: lin

sys_config:
  $shots: 1000
  /axisGeneratorIP_0:
    $dfrequency: 0
    $rfrequency: "#frequency_sweep"
    $rphase: 0.0
    $rchannel: 1
    $dchannel: 0
    pulse:
      - _name: rect_r
        _readout: true
        _envelope: _RECTANGULAR
        _dac_target: 1
        $duration: "%duration"
        $gain: "%gain"
  /axisAcquisitionIP_0:
    $duration: "%duration"
    $output_type: accumulated
    $rfrequency: "#frequency_sweep"
    $rphase: 0.0
    $rchannel: 1
    $tof: "%tof"
  /axisTriggerGenerator_0:
    $experiment_duration: 3000.0
    delay:
      - _name: readout_delay_0
        _ttype: readout
        _channel_mask: 1
        _index: 1
        $delay: 100.0


