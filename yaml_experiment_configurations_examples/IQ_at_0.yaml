preprocess:
  drive_modulation_frequency: 5625.213468
  readout_modulation_frequency: 7583.46
  drive_duration: 200
  readout_duration: 1000
  gain_pi: 0.101
  gain_r: 0.2
  tof: 200

variables: {}

sys_config:
  $shots: 10000
  /axisGeneratorIP_0:
    $dfrequency: "%drive_modulation_frequency"
    $rfrequency: "%readout_modulation_frequency"
    $rphase: 0.0
    $rchannel: 1
    $dchannel: 1
    pulse:
      - _name: rect_r
        _readout: true
        _envelope: _RECTANGULAR
        _dac_target: 1
        $duration: "%readout_duration"
        $gain: "%gain_r"
  /axisAcquisitionIP_0:
    $duration: "%readout_duration"
    $output_type: accumulated
    $rfrequency: "%readout_modulation_frequency"
    $rphase: 0.0
    $rchannel: 1
    $tof: "%tof"
  /axisTriggerGenerator_0:
    $experiment_duration: 70000
    delay:
      - _name: readout_delay_0
        _ttype: readout
        _channel_mask: 1
        _index: 1
        $delay: 100