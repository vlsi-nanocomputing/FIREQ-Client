# pyproject.toml
# This file centralizes project metadata and tool configuration.
# It allows the whole team (PyCharm, VS Code, CI) to use the same rules.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# Project metadata (used by packaging/build tools and some IDEs)
name = "fireq-client"
version = "0.1.2"
requires-python = ">=3.10"

# Runtime dependencies, aligned with requirements.txt.
# Python 3.10 gets the last matplotlib/numpy/pandas releases that support it.
dependencies = [
  "matplotlib==3.10.9; python_version < '3.11'",
  "matplotlib==3.11.0; python_version >= '3.11'",
  "msgpack==1.2.1",
  "numpy==2.2.6; python_version < '3.11'",
  "numpy==2.3.5; python_version >= '3.11'",
  "pandas==2.3.3; python_version < '3.11'",
  "pandas==3.0.3; python_version >= '3.11'",
  "prompt_toolkit==3.0.52",
  "PyYAML==6.0.3",
  "tqdm==4.67.3",
]

[project.optional-dependencies]
# Development tools
dev = [
  "black>=25.12.0",
  "pytest>=8.0",
  "ruff>=0.14.11",
]

[tool.black]
# Black is used for Python formatting.
# It reformats code deterministically (no warnings, only formatting).
line-length = 120
target-version = ["py310"]

[tool.ruff]
# Ruff is used only as a linter (static analysis), not as a formatter.
# It reports issues but should not modify code automatically.
line-length = 120
fix = false
unsafe-fixes = false

# Exclude non-Python sources / generated files from Ruff linting (project-specific).
# Note: Ruff already focuses on Python files, but this can be useful for repos with mixed content.
exclude = [
  "*.yaml",
  "*.yml",
  "*.pyi",
]

[tool.ruff.lint]
# Enabled rule families:
# E: pycodestyle errors (PEP 8)
# F: pyflakes (real errors)
# I: import sorting (isort-compatible)
# UP: pyupgrade (modern Python syntax)
# B: flake8-bugbear (likely bugs)
# D: pydocstyle (docstrings)
# ANN: type annotations
# PL: pylint-derived rules
select = ["E", "F", "I", "UP", "B", "D", "ANN", "PL"]

ignore = [
    "PLR09",
    "PLR2004",
]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "PLC0415", "SLF"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"
