preprocess: {}
variables: 
  tof:
    start: 10
    stop: 500
    num: 20
    mode: lin
sys_config:
  $shots: 10
  /axisGeneratorIP_0:
    $dfrequency: 3000
    $rfrequency: 500.0
    $rphase: 0.0
    $rchannel: 0
    $dchannel: 1
    pulse:
      - _name: rect
        _readout: false
        _envelope: _RECTANGULAR
        _dac_target: 2
        $duration: 1000.0
        $gain: 0.5
    $drive_order:
      - rect
  /axisAcquisitionIP_0:
    $duration: 1000
    $output_type: raw
    $rfrequency: 0
    $rphase: 0
    $rchannel: 1
    $tof: 2
  /axisTriggerGenerator_0:
    $experiment_duration: 102000.0
    delay:
      - _name: drivedel
        _ttype: drive
        _channel_mask: 1
        _index: 1
        $delay: 1000.0
      - _name: readout_delay_0
        _ttype: readout
        _channel_mask: 1
        _index: 2
        $delay: "#tof"