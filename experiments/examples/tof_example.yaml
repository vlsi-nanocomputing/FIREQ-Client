preprocess: {}
variables: 
  tof:
    start: 10
    stop: 500
    num: 20
    mode: lin
sys_config:
  $shots: 10
  /axisGeneratorIP_0:
    $dfrequency: 3000
    $rfrequency: 3000
    $rphase: 0.0
    $rchannel: 1
    $dchannel: 0
    pulse:
      - _name: rect
        _readout: true
        _envelope: _RECTANGULAR
        _dac_target: 1
        $duration: 1000.0
        $gain: 0.5
  /axisAcquisitionIP_0:
    $duration: 1500
    $output_type: decimated
    $rfrequency: 3000
    $rphase: 0
    $rchannel: 1
    $tof: "#tof"
  /axisTriggerGenerator_0:
    $experiment_duration: 102000.0
    delay:
      - _name: readout_delay_0
        _ttype: readout
        _channel_mask: 1
        _index: 1
        $delay: 100