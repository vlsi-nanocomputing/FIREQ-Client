variables:
  drive_delay_sweep_half:
    start: 10
    end: 10000
    num: 500
    mode: lin
sys_config:
  $shots: 1000
  /axisGeneratorIP_0:
    $dfrequency: 6000
    $rfrequency: 3000
    $rphase: 0.0
    $rchannel: 1
    $dchannel: 1
    pulse:
    - _name: rect_pi_half
      _readout: false
      _envelope: _RECTANGULAR
      _dac_target: 2
      $duration: 20
      $gain: 0.25
    - _name: rect_pi
      _readout: false
      _envelope: _RECTANGULAR
      _dac_target: 2
      $duration: 20
      $gain: 0.5
    - _name: rect_r
      _readout: true
      _envelope: _RECTANGULAR
      _dac_target: 2
      $duration: '1000'
      $gain: 0.5
    $drive_order:
    - rect_pi_half
    - rect_pi
    - rect_pi_half
  /axisAcquisitionIP_0:
    $duration: '1500'
    $output_type: accumulated
    $rfrequency: 500
    $rphase: 0.0
    $rchannel: 1
    $tof: 1
  /axisTriggerGenerator_0:
    $experiment_duration: 102000.0
    delay:
    - _name: drive_delay_0
      _ttype: drive
      _channel_mask: 1
      _index: 1
      $delay: 1000.0
    - _name: drive_delay_1
      _ttype: drive
      _channel_mask: 1
      _index: 2
      $delay: '#drive_delay_sweep_half'
    - _name: drive_delay_2
      _ttype: drive
      _channel_mask: 1
      _index: 3
      $delay: '#drive_delay_sweep_half'
    - _name: readout_delay_0
      _ttype: readout
      _channel_mask: 1
      _index: 4
      $delay: '10'
