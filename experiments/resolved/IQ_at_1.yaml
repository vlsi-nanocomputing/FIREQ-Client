variables:
  frequency_sweep:
    start: 6000
    end: 7000
    num: 3000
    mode: lin
sys_config:
  $shots: 1000
  /axisGeneratorIP_0:
    $dfrequency: 3000
    $rfrequency: 500
    $rphase: 0.0
    $rchannel: 1
    $dchannel: 1
    pulse:
    - _name: rect_pi
      _readout: false
      _envelope: _RECTANGULAR
      _dac_target: 2
      $duration: 20
      $gain: 0.5
    - _name: rect_r
      _readout: true
      _envelope: _RECTANGULAR
      _dac_target: 2
      $duration: 1000.0
      $gain: 0.5
    $drive_order:
    - rect_pi
  /axisAcquisitionIP_0:
    $duration: 1500.0
    $output_type: accumulated
    $rfrequency: '#frequency_sweep'
    $rphase: 0.0
    $rchannel: 1
    $tof: 1
  /axisTriggerGenerator_0:
    $experiment_duration: 102000.0
    delay:
    - _name: drive_delay
      _ttype: drive
      _channel_mask: 1
      _index: 1
      $delay: 1000.0
    - _name: readout_delay
      _ttype: readout
      _channel_mask: 1
      _index: 2
      $delay: 10.0
