variables:
  frequency_sweep:
    start: 6000
    end: 7000
    num: 3000
    mode: lin
  gain_sweep:
    start: 0.005
    end: 0.5
    num: 3000
    mode: lin
sys_config:
  $shots: 1000
  /axisGeneratorIP_0:
    $dfrequency: 3000
    $rfrequency: '#frequency_sweep'
    $rphase: 0.0
    $rchannel: 1
    $dchannel: 0
    pulse:
    - _name: rect_r
      _readout: true
      _envelope: _RECTANGULAR
      _dac_target: 2
      $duration: 1000.0
      $gain: '#gain_sweep'
  /axisAcquisitionIP_0:
    $duration: 1500.0
    $output_type: accumulated
    $rfrequency: '#frequency_sweep'
    $rphase: 0.0
    $rchannel: 1
    $tof: 1
  /axisTriggerGenerator_0:
    $experiment_duration: 102000.0
    delay:
    - _name: readout_delay_0
      _ttype: readout
      _channel_mask: 1
      _index: 1
      $delay: 10.0
